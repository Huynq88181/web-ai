spring.application.name=tracking
# Render/Railway cấp cổng qua biến PORT.
server.port=${PORT:8080}

# Dev: H2 dạng file. Production: đặt SPRING_PROFILES_ACTIVE=prod và biến DATABASE_URL.
spring.datasource.url=jdbc:h2:file:./data/tracking
spring.jpa.hibernate.ddl-auto=update

# Danh sách tên miền web được phép gọi API, ngăn cách bằng dấu phẩy.
app.allowed-origins=${ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
# Muối để băm IP. Đổi giá trị này ở production.
app.ip-salt=${IP_SALT:dev-salt}
# Token cho /api/admin/*. Để trống thì khoá toàn bộ API quản trị.
app.admin-token=${ADMIN_TOKEN:}
